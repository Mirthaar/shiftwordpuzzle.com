<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shift - Daily Word Puzzle</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #14110D;
      color: #EAE2D0;
      font-family: 'Archivo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 900px;
      padding: 32px 24px;
      display: flex;
      justify-content: center;
    }

    .wordmark {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .wordmark span { color: #D4A24C; }

    section.feature {
      width: 100%;
      max-width: 480px;
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    section.feature img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .cta {
      width: 100%;
      max-width: 900px;
      padding: 24px 24px 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .coming-soon {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #1A1611;
      border: 1px solid rgba(234, 226, 208, 0.14);
      border-radius: 10px;
      color: #8A8070;
      font-family: 'Archivo', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0 24px;
      height: 52px;
      opacity: 0.85;
    }

    footer {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(138, 128, 112, 0.6);
      text-transform: uppercase;
      padding: 24px 24px 60px;
    }

    footer a {
      color: rgba(138, 128, 112, 0.6);
      text-decoration: none;
    }

    footer a:hover { color: #8A8070; }
  </style>
</head>
<body>

  <header>
    <div class="wordmark">shift<span>.</span></div>
  </header>

  <section class="feature">
    <img src="images/01-board.png" alt="Shift: Travel from word to word. Change one letter at a time to reach the target word." />
  </section>

  <section class="feature">
    <img src="images/02-home.png" alt="Shift: A fresh puzzle every day. A brand-new word puzzle boards every single morning." />
  </section>

  <section class="feature">
    <img src="images/03-win.png" alt="Shift: Every win earns you miles. Reach your destination and cash in on the reward." />
  </section>

  <div class="cta">
    <div class="coming-soon">Coming soon to the Apple App Store</div>
  </div>

  <footer>
    <a href="/privacy-policy">Privacy Policy</a> &middot; <a href="/terms-of-service">Terms of Service</a>
  </footer>

</body>
</html>
